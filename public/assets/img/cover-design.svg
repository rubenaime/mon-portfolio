    <filter id="blur5" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="noise5"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer><feComposite operator="in" in2="SourceGraphic"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg5)"/>
  <rect width="1600" height="1000" fill="url(#grid5)"/>
