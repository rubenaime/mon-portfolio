<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Visuel de projet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1d16"/><stop offset="1" stop-color="#0b0d0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c9f45b" stop-opacity=".35"/><stop offset="1" stop-color="#c9f45b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <ellipse cx="800" cy="500" rx="620" ry="460" fill="url(#glow)" opacity=".55"/>
  <g fill="none" stroke="#c9f45b" stroke-opacity=".5">
    <circle cx="800" cy="500" r="220"/>
    <circle cx="800" cy="500" r="300" stroke-opacity=".25"/>
    <circle cx="800" cy="500" r="380" stroke-opacity=".12"/>
  </g>
  <g transform="translate(800 500)">
    <rect x="-170" y="-170" width="340" height="340" rx="44" fill="#0f1210" stroke="#c9f45b" stroke-opacity=".35"/>
    <text x="0" y="30" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-size="110" font-weight="800" letter-spacing="-6" fill="#c9f45b">RE</text>
    <text x="0" y="82" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="18" letter-spacing="7" fill="#ffffff" fill-opacity=".45">PROJET</text>
  </g>
  <text x="150" y="880" font-family="JetBrains Mono, monospace" font-size="20" letter-spacing="5" fill="#ffffff" fill-opacity=".35">RUBEN EBAH — PORTFOLIO 2026</text>
</svg>
